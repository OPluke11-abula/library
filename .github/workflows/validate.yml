name: Knowledge Base Integrity Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Provenance Regression Test
        run: |
          python -m unittest -v tests/test_provenance_regression.py

      - name: Run Library Integrity Validator
        run: |
          python scripts/validate_library.py
