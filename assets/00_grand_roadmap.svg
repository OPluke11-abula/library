<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f17; }
      .grid-line { stroke: #1e293b; stroke-width: 0.5; stroke-dasharray: 4 4; opacity: 0.4; }
      .tier-bg { fill: #111827; stroke: #1f2937; stroke-width: 1; rx: 8px; }
      .tier-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .node-box { fill: #182234; stroke: #334155; stroke-width: 1.2; rx: 6px; }
      .node-box:hover { stroke: #38bdf8; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f1f5f9; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .node-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; }
      .path-arrow { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .tag-pill { rx: 4px; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.02em; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
    </style>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" class="bg" />

  <!-- Technical Grid overlay -->
  <line x1="60" y1="90" x2="1140" y2="90" class="grid-line" />
  <line x1="60" y1="270" x2="1140" y2="270" class="grid-line" />
  <line x1="60" y1="480" x2="1140" y2="480" class="grid-line" />

  <!-- Top Header Bar -->
  <g transform="translate(60, 35)">
    <text class="header-title" x="0" y="24">全館知識拓樸航海圖 (Grand Library Topological Roadmap)</text>
    <text class="header-sub" x="0" y="46">資訊工程與深度學習宏偉圖書館 • 十大分館三階層有向無環圖 (3-Tier DAG) • 20 卷典籍閉環導通</text>

    <!-- Clean Status Indicators -->
    <g transform="translate(850, 8)">
      <rect width="230" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="16" r="4" fill="#10b981" />
      <text x="32" y="20" class="legend-text" font-weight="600">67 條形式化 Agent 契約守護</text>
    </g>
  </g>

  <!-- ================= TIER 1: Foundations & Systems ================= -->
  <g transform="translate(60, 105)">
    <rect width="1080" height="150" class="tier-bg" />
    <text x="24" y="26" class="tier-label" fill="#38bdf8">Tier 1 • 數理理論基石與計算機體系結構 (Foundations &amp; Systems Architecture)</text>
    
    <!-- LIB-001 -->
    <g transform="translate(24, 42)">
      <rect width="240" height="92" class="node-box" stroke="#38bdf8" />
      <text x="14" y="24" class="node-code" fill="#38bdf8">LIB-001 [先修基石]</text>
      <text x="14" y="44" class="node-title">深度學習第一性原理先修</text>
      <text x="14" y="64" class="node-sub">模型學習六大基石 • 封裝解密</text>
      <text x="14" y="80" class="node-sub" fill="#64748b">Prereq: 無 • 入度: 6 • 出度: 6</text>
    </g>

    <!-- LIB-101 -->
    <g transform="translate(290, 42)">
      <rect width="240" height="92" class="node-box" stroke="#f59e0b" />
      <text x="14" y="24" class="node-code" fill="#f59e0b">LIB-101 [數學理論]</text>
      <text x="14" y="44" class="node-title">線性代數與高維幾何變換</text>
      <text x="14" y="64" class="node-sub">投影本質 • 矩陣奇異值分解 (SVD)</text>
      <text x="14" y="80" class="node-sub" fill="#64748b">核心入度: 27 • 全館第一代數基石</text>
    </g>

    <!-- LIB-104 -->
    <g transform="translate(555, 42)">
      <rect width="240" height="92" class="node-box" stroke="#f59e0b" />
      <text x="14" y="24" class="node-code" fill="#f59e0b">LIB-104 [最佳化理論]</text>
      <text x="14" y="44" class="node-title">凸最佳化與梯度下降幾何</text>
      <text x="14" y="64" class="node-sub">一階二階下降 • AdamW • 損失曲面</text>
      <text x="14" y="80" class="node-sub" fill="#64748b">核心入度: 12 • 數值最佳化中樞</text>
    </g>

    <!-- LIB-203 -->
    <g transform="translate(820, 42)">
      <rect width="236" height="92" class="node-box" stroke="#10b981" />
      <text x="14" y="24" class="node-code" fill="#10b981">LIB-203 [硬體對齊]</text>
      <text x="14" y="44" class="node-title">計算機體系結構與硬體對齊</text>
      <text x="14" y="64" class="node-sub">CUDA Warp 32 • Tensor Core • TMA</text>
      <text x="14" y="80" class="node-sub" fill="#64748b">核心入度: 32 (全館最高) • 硬體錨點</text>
    </g>
  </g>

  <!-- Connectors Tier 1 -> Tier 2 -->
  <path d="M 180 255 L 180 285" class="path-arrow" stroke="#38bdf8" marker-end="url(#arrow-sky)" />
  <path d="M 440 255 L 440 285" class="path-arrow" stroke="#38bdf8" marker-end="url(#arrow-sky)" />
  <path d="M 700 255 L 700 285" class="path-arrow" stroke="#38bdf8" marker-end="url(#arrow-sky)" />
  <path d="M 960 255 L 960 285" class="path-arrow" stroke="#10b981" marker-end="url(#arrow-emerald)" />

  <!-- ================= TIER 2: Core Architectures & Modalities ================= -->
  <g transform="translate(60, 285)">
    <rect width="1080" height="185" class="tier-bg" />
    <text x="24" y="24" class="tier-label" fill="#818cf8">Tier 2 • 核心架構、感知前沿與系統工程 (Core Learning &amp; System Modalities)</text>

    <!-- Stream A: Visual Pipeline -->
    <g transform="translate(24, 38)">
      <rect width="250" height="132" rx="6" fill="#131d2e" stroke="#1e293b" />
      <text x="12" y="20" class="node-code" fill="#0284c7">視覺感測與三維流 (CV &amp; 3DGS)</text>
      <text x="12" y="42" class="node-title">LIB-401 CNN 歸納偏置</text>
      <text x="12" y="60" class="node-sub">平移等變性 • 空間坐標死記破除</text>
      <line x1="12" y1="70" x2="238" y2="70" stroke="#1e293b" />
      <text x="12" y="88" class="node-title">LIB-501 CV 質心定位演算法</text>
      <text x="12" y="106" class="node-title">LIB-504 3D/4D 高斯潑濺 (3DGS)</text>
      <text x="12" y="122" class="node-sub" fill="#64748b">LeCun 重心限幅 • 視角解耦光柵化</text>
    </g>

    <!-- Stream B: Sequence & Generative -->
    <g transform="translate(290, 38)">
      <rect width="250" height="132" rx="6" fill="#131d2e" stroke="#1e293b" />
      <text x="12" y="20" class="node-code" fill="#f43f5e">語言、注意力與生成 (LLM &amp; Generative)</text>
      <text x="12" y="42" class="node-title">LIB-405 Transformer 與注意力</text>
      <text x="12" y="60" class="node-sub">FlashAttention • RoPE 旋轉位置編碼</text>
      <line x1="12" y1="70" x2="238" y2="70" stroke="#1e293b" />
      <text x="12" y="88" class="node-title">LIB-602 大語言模型縮放定律</text>
      <text x="12" y="106" class="node-title">LIB-406 流匹配 (Flow Matching) &amp; DiT</text>
      <text x="12" y="122" class="node-sub" fill="#64748b">最佳傳輸直線軌跡 κ=0 • Chinchilla</text>
    </g>

    <!-- Stream C: Autonomous Agents -->
    <g transform="translate(555, 38)">
      <rect width="250" height="132" rx="6" fill="#131d2e" stroke="#1e293b" />
      <text x="12" y="20" class="node-code" fill="#ea580c">智慧代理人與決策 (Autonomous Agents)</text>
      <text x="12" y="42" class="node-title">LIB-703 LLM Agent 認知協議</text>
      <text x="12" y="60" class="node-sub">ReAct 閉環思考 • 記憶體與外掛工具</text>
      <line x1="12" y1="70" x2="238" y2="70" stroke="#1e293b" />
      <text x="12" y="88" class="node-title">LIB-704 S1/S2 雙進程神經代理人</text>
      <text x="12" y="108" class="node-sub">Jev 非自迴歸型態決策 • CUA-S1</text>
      <text x="12" y="122" class="node-sub" fill="#64748b">50ms 螢幕反射決策 • RLCD 閾值 τ</text>
    </g>

    <!-- Stream D: Robustness & Quantization -->
    <g transform="translate(820, 38)">
      <rect width="236" height="132" rx="6" fill="#131d2e" stroke="#1e293b" />
      <text x="12" y="20" class="node-code" fill="#14b8a6">工程部署與校準 (Robustness &amp; Quant)</text>
      <text x="12" y="42" class="node-title">LIB-301 資料分佈偏差與漂移</text>
      <text x="12" y="60" class="node-sub">亞洲 7 與美式 7 • 空間負權重禁區</text>
      <line x1="12" y1="70" x2="224" y2="70" stroke="#1e293b" />
      <text x="12" y="88" class="node-title">LIB-801 模型校準與不確定性 (ECE)</text>
      <text x="12" y="106" class="node-title">LIB-802 AWQ 模型量化推論</text>
      <text x="12" y="122" class="node-sub" fill="#64748b">溫度縮放 • INT4/FP8 邊緣高效部署</text>
    </g>
  </g>

  <!-- Connectors Tier 2 -> Tier 3 -->
  <path d="M 280 470 L 280 500" class="path-arrow" stroke="#818cf8" marker-end="url(#arrow-indigo)" />
  <path d="M 600 470 L 600 500" class="path-arrow" stroke="#818cf8" marker-end="url(#arrow-indigo)" />
  <path d="M 920 470 L 920 500" class="path-arrow" stroke="#818cf8" marker-end="url(#arrow-indigo)" />

  <!-- ================= TIER 3: Convergence & Capstone ================= -->
  <g transform="translate(60, 500)">
    <rect width="1080" height="145" class="tier-bg" />
    <text x="24" y="24" class="tier-label" fill="#d946ef">Tier 3 • 專案實證、學術推甄與指導教授實驗室科研 (Convergence &amp; Lab Synergy)</text>

    <!-- LIB-901 -->
    <g transform="translate(24, 38)">
      <rect width="325" height="92" class="node-box" stroke="#d946ef" />
      <text x="14" y="24" class="node-code" fill="#d946ef">LIB-901 [實證復盤]</text>
      <text x="14" y="44" class="node-title">課堂作業至生產級 MNIST 系統復盤</text>
      <text x="14" y="64" class="node-sub">六大模組管線 • 消除過度自信 • Gradio 畫板</text>
      <text x="14" y="80" class="node-sub" fill="#64748b">工程邊界驗證 • 出度: 27 • 實證落地錨點</text>
    </g>

    <!-- LIB-903 -->
    <g transform="translate(375, 38)">
      <rect width="340" height="92" class="node-box" stroke="#d946ef" />
      <text x="14" y="24" class="node-code" fill="#d946ef">LIB-903 [專題藍圖]</text>
      <text x="14" y="44" class="node-title">專題基石藍圖、推甄與研究演進</text>
      <text x="14" y="64" class="node-sub">國科會 C801 計畫書 • 頂大推甄戰略 • 論文八階</text>
      <text x="14" y="80" class="node-sub" fill="#64748b">專題獨立研發協同矩陣 (Luke 游啓揚,  游啓揚,  游啓揚)</text>
    </g>

    <!-- LIB-904 -->
    <g transform="translate(740, 38)">
      <rect width="316" height="92" class="node-box" stroke="#d946ef" />
      <text x="14" y="24" class="node-code" fill="#d946ef">LIB-904 [實驗室對齊]</text>
      <text x="14" y="44" class="node-title">指導教授實驗室研究體系與專題對齊</text>
      <text x="14" y="64" class="node-sub">中原資工莊啓宏博士 • AI &amp; Visual Analytics Lab</text>
      <text x="14" y="80" class="node-sub" fill="#64748b">NVIDIA Campus Ambassador • 2024-2026 期刊</text>
    </g>
  </g>
</svg>