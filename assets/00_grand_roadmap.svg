<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <style>
      .canvas-bg { fill: #0d1117; }
      .outer-border { fill: none; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .tier-container { rx: 8px; stroke-width: 1.2; }
      .tier-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.03em; }
      .node-card { stroke-width: 1.2; rx: 6px; }
      .node-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #f0f6fc; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #8b949e; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #f0f6fc; letter-spacing: -0.01em; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #8b949e; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #c9d1d9; }
      .conn-line { fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bc8cff" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with subtle border -->
  <rect width="1200" height="720" class="canvas-bg" />
  <rect x="1" y="1" width="1198" height="718" class="outer-border" />

  <!-- Header Section -->
  <g transform="translate(50, 28)">
    <text class="header-title" x="0" y="20">知識拓樸依賴圖譜 (Knowledge Dependency Graph)</text>
    <text class="header-sub" x="0" y="40">資訊工程與深度學習知識庫 • 三層架構有向無環圖 (3-Tier DAG) • 卷冊模組拓樸導通</text>
    
    <!-- Status Pill -->
    <g transform="translate(930, 4)">
      <rect width="170" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#3fb950" />
      <text x="28" y="18" class="legend-text" font-weight="600" fill="#f0f6fc">66 條系統規範與不變量</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="50" y1="78" x2="1150" y2="78" stroke="#30363d" stroke-width="1" />

  <!-- ================= TIER 1: Foundations & Systems ================= -->
  <g transform="translate(50, 95)">
    <rect width="1100" height="165" class="tier-container" fill="#161b22" stroke="#30363d" />
    <text x="24" y="26" class="tier-label" fill="#79c0ff">第 1 層 • 數理理論基石與計算機體系結構 (Foundations &amp; Systems Architecture)</text>
    
    <!-- LIB-001 -->
    <g transform="translate(24, 42)">
      <rect width="245" height="105" class="node-card" fill="#132238" stroke="#1f6feb" />
      <text x="14" y="22" class="node-code" fill="#58a6ff">LIB-001 [先修基石]</text>
      <text x="14" y="42" class="node-title">深度學習第一性原理先修</text>
      <text x="14" y="62" class="node-desc">六大數理支柱 • 矩陣/損失/梯度</text>
      <text x="14" y="80" class="node-desc">反向傳播直覺 • Adam 幾何</text>
      <rect x="14" y="88" width="130" height="12" rx="3" fill="#1b2d47" />
      <text x="18" y="97" font-family="monospace" font-size="8.5" fill="#79c0ff">INV: y = Wx + b</text>
    </g>

    <!-- LIB-101 -->
    <g transform="translate(295, 42)">
      <rect width="245" height="105" class="node-card" fill="#132238" stroke="#1f6feb" />
      <text x="14" y="22" class="node-code" fill="#58a6ff">LIB-101 [數理基石]</text>
      <text x="14" y="42" class="node-title">線性代數與高維幾何本質</text>
      <text x="14" y="62" class="node-desc">奇異值分解 SVD • 旋轉縮放投影</text>
      <text x="14" y="80" class="node-desc">特徵基底變換 • 降維流形拓樸</text>
      <rect x="14" y="88" width="140" height="12" rx="3" fill="#1b2d47" />
      <text x="18" y="97" font-family="monospace" font-size="8.5" fill="#79c0ff">INV: A = U Σ V^T</text>
    </g>

    <!-- LIB-104 -->
    <g transform="translate(565, 42)">
      <rect width="245" height="105" class="node-card" fill="#132238" stroke="#1f6feb" />
      <text x="14" y="22" class="node-code" fill="#58a6ff">LIB-104 [最佳化理論]</text>
      <text x="14" y="42" class="node-title">凸最佳化與梯度下降幾何</text>
      <text x="14" y="62" class="node-desc">Lipschitz 梯度連續 • Hessian 矩陣</text>
      <text x="14" y="80" class="node-desc">一階動量慣性 • 二階自適應降速</text>
      <rect x="14" y="88" width="135" height="12" rx="3" fill="#1b2d47" />
      <text x="18" y="97" font-family="monospace" font-size="8.5" fill="#79c0ff">INV: θ_{t+1} = θ_t - η v_t</text>
    </g>

    <!-- LIB-203 -->
    <g transform="translate(835, 42)">
      <rect width="240" height="105" class="node-card" fill="#132238" stroke="#1f6feb" />
      <text x="14" y="22" class="node-code" fill="#58a6ff">LIB-203 [硬體架構]</text>
      <text x="14" y="42" class="node-title">計算機體系結構與硬體對齊</text>
      <text x="14" y="62" class="node-desc">GPU Warp (32 執行緒) 分支對齊</text>
      <text x="14" y="80" class="node-desc">Tensor Core GEMM • 128B 合併</text>
      <rect x="14" y="88" width="155" height="12" rx="3" fill="#1b2d47" />
      <text x="18" y="97" font-family="monospace" font-size="8.5" fill="#79c0ff">INV: dim % 32 == 0</text>
    </g>
  </g>

  <!-- Connectors Tier 1 -> Tier 2 -->
  <path d="M 220 260 L 220 280 L 150 280 L 150 300" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />
  <path d="M 440 260 L 440 280 L 330 280 L 330 300" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />
  <path d="M 440 260 L 440 280 L 485 280 L 485 300" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />
  <path d="M 710 260 L 710 280 L 640 280 L 640 300" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />
  <path d="M 980 260 L 980 280 L 795 280 L 795 300" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />
  <path d="M 980 260 L 980 280 L 950 280 L 950 300" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />

  <!-- ================= TIER 2: Perception, Spatial & Architectures ================= -->
  <g transform="translate(50, 305)">
    <rect width="1100" height="185" class="tier-container" fill="#091d17" stroke="#134e4a" />
    <text x="24" y="26" class="tier-label" fill="#56d364">第 2 層 • 資料分佈、模型架構與高維感知 (Perception, Architectures &amp; Vision)</text>

    <!-- LIB-301 -->
    <g transform="translate(24, 40)">
      <rect width="145" height="128" class="node-card" fill="#0e2a20" stroke="#238636" />
      <text x="10" y="20" class="node-code" fill="#3fb950">LIB-301 [分佈偏差]</text>
      <text x="10" y="38" class="node-title">資料集文化偏差</text>
      <text x="10" y="56" class="node-desc">美式斜切 vs 直立 7</text>
      <text x="10" y="74" class="node-desc">負權重禁區扣分</text>
      <text x="10" y="92" class="node-desc">OOD 領域漂移幾何</text>
      <rect x="10" y="104" width="125" height="12" rx="3" fill="#153d2e" />
      <text x="14" y="113" font-family="monospace" font-size="8" fill="#3fb950">INV: P_train ≠ P_test</text>
    </g>

    <!-- LIB-401 -->
    <g transform="translate(180, 40)">
      <rect width="145" height="128" class="node-card" fill="#0e2a20" stroke="#238636" />
      <text x="10" y="20" class="node-code" fill="#3fb950">LIB-401 [CNN 必然性]</text>
      <text x="10" y="38" class="node-title">DNN 極限與 CNN</text>
      <text x="10" y="56" class="node-desc">空間排列破壞盲區</text>
      <text x="10" y="74" class="node-desc">局部感受野約束</text>
      <text x="10" y="92" class="node-desc">平移等變性數學證明</text>
      <rect x="10" y="104" width="125" height="12" rx="3" fill="#153d2e" />
      <text x="14" y="113" font-family="monospace" font-size="8" fill="#3fb950">INV: f(g(x)) = g(f(x))</text>
    </g>

    <!-- LIB-501 -->
    <g transform="translate(335, 40)">
      <rect width="145" height="128" class="node-card" fill="#0e2a20" stroke="#238636" />
      <text x="10" y="20" class="node-code" fill="#3fb950">LIB-501 [CV 前處理]</text>
      <text x="10" y="38" class="node-title">前處理與質心定位</text>
      <text x="10" y="56" class="node-desc">20x20 外接矩形邊界</text>
      <text x="10" y="74" class="node-desc">墨水一階動差重心</text>
      <text x="10" y="92" class="node-desc">±3px 硬鉗制限幅</text>
      <rect x="10" y="104" width="125" height="12" rx="3" fill="#153d2e" />
      <text x="14" y="113" font-family="monospace" font-size="8" fill="#3fb950">INV: x̄ = M10 / M00</text>
    </g>

    <!-- LIB-405 -->
    <g transform="translate(490, 40)">
      <rect width="145" height="128" class="node-card" fill="#0e2a20" stroke="#238636" />
      <text x="10" y="20" class="node-code" fill="#3fb950">LIB-405 [注意力革命]</text>
      <text x="10" y="38" class="node-title">Transformer 架構</text>
      <text x="10" y="56" class="node-desc">Scaled Dot-Product</text>
      <text x="10" y="74" class="node-desc">RoPE 旋轉位置編碼</text>
      <text x="10" y="92" class="node-desc">FlashAttention-3</text>
      <rect x="10" y="104" width="125" height="12" rx="3" fill="#153d2e" />
      <text x="14" y="113" font-family="monospace" font-size="8" fill="#3fb950">INV: QK^T / √d_k</text>
    </g>

    <!-- LIB-406 -->
    <g transform="translate(645, 40)">
      <rect width="145" height="128" class="node-card" fill="#0e2a20" stroke="#238636" />
      <text x="10" y="20" class="node-code" fill="#3fb950">LIB-406 [生成模型前沿]</text>
      <text x="10" y="38" class="node-title">流匹配與 DiT 革命</text>
      <text x="10" y="56" class="node-desc">Score-SDE 擴散積分</text>
      <text x="10" y="74" class="node-desc">最佳傳輸直線 ODE</text>
      <text x="10" y="92" class="node-desc">MM-DiT 雙流架構</text>
      <rect x="10" y="104" width="125" height="12" rx="3" fill="#153d2e" />
      <text x="14" y="113" font-family="monospace" font-size="8" fill="#3fb950">INV: dx/dt = x1 - x0</text>
    </g>

    <!-- LIB-504 -->
    <g transform="translate(800, 40)">
      <rect width="140" height="128" class="node-card" fill="#0e2a20" stroke="#238636" />
      <text x="10" y="20" class="node-code" fill="#3fb950">LIB-504 [3D 視覺前沿]</text>
      <text x="10" y="38" class="node-title">3DGS 神經渲染</text>
      <text x="10" y="56" class="node-desc">NeRF 連續輻射場</text>
      <text x="10" y="74" class="node-desc">3D 高斯橢球集</text>
      <text x="10" y="92" class="node-desc">可微分高速光柵化</text>
      <rect x="10" y="104" width="120" height="12" rx="3" fill="#153d2e" />
      <text x="14" y="113" font-family="monospace" font-size="8" fill="#3fb950">INV: α exp(-1/2 Δx^T Σ^-1 Δx)</text>
    </g>

    <!-- LIB-602 -->
    <g transform="translate(950, 40)">
      <rect width="130" height="128" class="node-card" fill="#0e2a20" stroke="#238636" />
      <text x="10" y="20" class="node-code" fill="#3fb950">LIB-602 [大語言模型]</text>
      <text x="10" y="38" class="node-title">LLM 架構縮放定律</text>
      <text x="10" y="56" class="node-desc">Chinchilla 最佳曲線</text>
      <text x="10" y="74" class="node-desc">RMSNorm • SwiGLU</text>
      <text x="10" y="92" class="node-desc">Grouped-Query (GQA)</text>
      <rect x="10" y="104" width="110" height="12" rx="3" fill="#153d2e" />
      <text x="14" y="113" font-family="monospace" font-size="8" fill="#3fb950">INV: N_opt ∝ C^0.5</text>
    </g>
  </g>

  <!-- Connectors Tier 2 -> Tier 3 -->
  <path d="M 120 490 L 120 510 L 190 510 L 190 530" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />
  <path d="M 405 490 L 405 510 L 190 510 L 190 530" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />
  <path d="M 560 490 L 560 510 L 370 510 L 370 530" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />
  <path d="M 720 490 L 720 510 L 530 510 L 530 530" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />
  <path d="M 870 490 L 870 510 L 1000 510 L 1000 530" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />
  <path d="M 1010 490 L 1010 510 L 690 510 L 690 530" class="conn-line" stroke="#8b949e" marker-end="url(#arr-slate)" />

  <!-- ================= TIER 3: Systems, Agents & Research Methodology ================= -->
  <g transform="translate(50, 535)">
    <rect width="1100" height="155" class="tier-container" fill="#19132b" stroke="#4c1d95" />
    <text x="24" y="24" class="tier-label" fill="#d2a8ff">第 3 層 • 系統工程、自主代理人與學術科研文獻體系 (Systems, Agents &amp; Research Methodology)</text>

    <!-- LIB-801 -->
    <g transform="translate(24, 38)">
      <rect width="140" height="102" class="node-card" fill="#241842" stroke="#8957e5" />
      <text x="10" y="18" class="node-code" fill="#d2a8ff">LIB-801 [模型校準]</text>
      <text x="10" y="36" class="node-title">不確定性與校準</text>
      <text x="10" y="54" class="node-desc">8層盲信 vs 4層校準</text>
      <text x="10" y="70" class="node-desc">ECE 度量 • 溫度縮放</text>
      <rect x="10" y="80" width="120" height="12" rx="3" fill="#331f5c" />
      <text x="14" y="89" font-family="monospace" font-size="8" fill="#bc8cff">INV: ECE &lt; 0.05</text>
    </g>

    <!-- LIB-802 -->
    <g transform="translate(175, 38)">
      <rect width="140" height="102" class="node-card" fill="#241842" stroke="#8957e5" />
      <text x="10" y="18" class="node-code" fill="#d2a8ff">LIB-802 [模型量化]</text>
      <text x="10" y="36" class="node-title">低精度推論架構</text>
      <text x="10" y="54" class="node-desc">AWQ • GPTQ 量化</text>
      <text x="10" y="70" class="node-desc">INT4/FP8 Tensor Core</text>
      <rect x="10" y="80" width="120" height="12" rx="3" fill="#331f5c" />
      <text x="14" y="89" font-family="monospace" font-size="8" fill="#bc8cff">INV: q = clip(round(x/S)+Z)</text>
    </g>

    <!-- LIB-703 -->
    <g transform="translate(325, 38)">
      <rect width="145" height="102" class="node-card" fill="#241842" stroke="#8957e5" />
      <text x="10" y="18" class="node-code" fill="#d2a8ff">LIB-703 [智慧代理人]</text>
      <text x="10" y="36" class="node-title">LLM 認知推論協議</text>
      <text x="10" y="54" class="node-desc">ReAct 思考-行動迴圈</text>
      <text x="10" y="70" class="node-desc">嚴格型別工具調用</text>
      <rect x="10" y="80" width="125" height="12" rx="3" fill="#331f5c" />
      <text x="14" y="89" font-family="monospace" font-size="8" fill="#bc8cff">INV: Strict JSON-RPC</text>
    </g>

    <!-- LIB-704 -->
    <g transform="translate(480, 38)">
      <rect width="150" height="102" class="node-card" fill="#241842" stroke="#8957e5" />
      <text x="10" y="18" class="node-code" fill="#d2a8ff">LIB-704 [雙進程代理人]</text>
      <text x="10" y="36" class="node-title">S1 非自迴歸 + S2</text>
      <text x="10" y="54" class="node-desc">Jev 型別決策引擎</text>
      <text x="10" y="70" class="node-desc">CUA-S1 介面反射模型</text>
      <rect x="10" y="80" width="130" height="12" rx="3" fill="#331f5c" />
      <text x="14" y="89" font-family="monospace" font-size="8" fill="#bc8cff">INV: Gating τ &gt;= 0.85</text>
    </g>

    <!-- LIB-901 -->
    <g transform="translate(640, 38)">
      <rect width="145" height="102" class="node-card" fill="#241842" stroke="#8957e5" />
      <text x="10" y="18" class="node-code" fill="#d2a8ff">LIB-901 [專案實證復盤]</text>
      <text x="10" y="36" class="node-title">MNIST 生產級管線</text>
      <text x="10" y="54" class="node-desc">從課堂作業到生產系統</text>
      <text x="10" y="70" class="node-desc">6 大模組全生命週期</text>
      <rect x="10" y="80" width="125" height="12" rx="3" fill="#331f5c" />
      <text x="14" y="89" font-family="monospace" font-size="8" fill="#bc8cff">INV: Zero NaN / OOM</text>
    </g>

    <!-- LIB-903 -->
    <g transform="translate(795, 38)">
      <rect width="145" height="102" class="node-card" fill="#241842" stroke="#8957e5" />
      <text x="10" y="18" class="node-code" fill="#d2a8ff">LIB-903 [專題基石藍圖]</text>
      <text x="10" y="36" class="node-title">專題研究演進藍圖</text>
      <text x="10" y="54" class="node-desc">國科會 C801 計畫書</text>
      <text x="10" y="70" class="node-desc">消融實驗與研究矩陣</text>
      <rect x="10" y="80" width="125" height="12" rx="3" fill="#331f5c" />
      <text x="14" y="89" font-family="monospace" font-size="8" fill="#bc8cff">INV: Luke Solo Research</text>
    </g>

    <!-- LIB-904 -->
    <g transform="translate(950, 38)">
      <rect width="135" height="102" class="node-card" fill="#241842" stroke="#8957e5" />
      <text x="10" y="18" class="node-code" fill="#d2a8ff">LIB-904 [學術科研體系]</text>
      <text x="10" y="36" class="node-title">前沿文獻研讀合成</text>
      <text x="10" y="54" class="node-desc">3DGS LoRA • CA-Jaccard</text>
      <text x="10" y="70" class="node-desc">Hilbert 序列化 • Bunch TTA</text>
      <rect x="10" y="80" width="115" height="12" rx="3" fill="#331f5c" />
      <text x="14" y="89" font-family="monospace" font-size="8" fill="#bc8cff">INV: IEEE / MDPI SOTA</text>
    </g>
  </g>
</svg>