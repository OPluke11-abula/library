<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGradCode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadowCode">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <marker id="arrowCode" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="1100" height="620" rx="16" fill="url(#bgGradCode)" />

  <!-- Badge -->
  <rect x="50" y="30" width="280" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5" />
  <text x="190" y="52" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">💻 程式篇 (Code & Architecture)</text>

  <text x="50" y="105" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="800">生產級六大模組管線與 GPU 硬體對齊 (LIB-901)</text>
  <text x="50" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">從陽春課堂範本進化為工業級可維護架構：NVIDIA Warp 32 執行緒記憶體合併讀取與防呆規範</text>

  <!-- 6 Pipeline Stages Horizontal Flow -->
  <g transform="translate(50, 165)" filter="url(#shadowCode)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="150" height="230" rx="10" fill="url(#cardGradCode)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="150" height="4" fill="url(#greenAccent)" />
    <text x="15" y="30" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">MODULE 01</text>
    <text x="15" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">環境檢測</text>
    <text x="15" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      <tspan x="15" dy="0">• TF 2.x 驗證</tspan>
      <tspan x="15" dy="20">• GPU 探測</tspan>
      <tspan x="15" dy="20">• CUDA 對齊</tspan>
      <tspan x="15" dy="20">• 防版本陷阱</tspan>
      <tspan x="15" dy="30" fill="#10b981">Zero Crash</tspan>
    </text>

    <!-- Arrow 1 to 2 -->
    <path d="M 155 115 L 168 115" stroke="#10b981" stroke-width="2" marker-end="url(#arrowCode)" />

    <!-- Stage 2 -->
    <rect x="175" y="0" width="150" height="230" rx="10" fill="url(#cardGradCode)" stroke="#334155" stroke-width="1.5" />
    <rect x="175" y="0" width="150" height="4" fill="url(#greenAccent)" />
    <text x="190" y="30" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">MODULE 02</text>
    <text x="190" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">載入與視覺化</text>
    <text x="190" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      <tspan x="190" dy="0">• MNIST 載入</tspan>
      <tspan x="190" dy="20">• 互動拉桿 Slider</tspan>
      <tspan x="190" dy="20">• 防呆維度還原</tspan>
      <tspan x="190" dy="20">• reshape(28,28)</tspan>
      <tspan x="190" dy="30" fill="#10b981">[RULE-901-01]</tspan>
    </text>

    <!-- Arrow 2 to 3 -->
    <path d="M 330 115 L 343 115" stroke="#10b981" stroke-width="2" marker-end="url(#arrowCode)" />

    <!-- Stage 3 -->
    <rect x="350" y="0" width="150" height="230" rx="10" fill="url(#cardGradCode)" stroke="#334155" stroke-width="1.5" />
    <rect x="350" y="0" width="150" height="4" fill="url(#greenAccent)" />
    <text x="365" y="30" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">MODULE 03</text>
    <text x="365" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">數值前處理</text>
    <text x="365" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      <tspan x="365" dy="0">• float32 / 255.0</tspan>
      <tspan x="365" dy="20">• 嚴禁重複除255</tspan>
      <tspan x="365" dy="20">• 784 維平坦化</tspan>
      <tspan x="365" dy="20">• One-hot (10類)</tspan>
      <tspan x="365" dy="30" fill="#10b981">[RULE-901-02]</tspan>
    </text>

    <!-- Arrow 3 to 4 -->
    <path d="M 505 115 L 518 115" stroke="#10b981" stroke-width="2" marker-end="url(#arrowCode)" />

    <!-- Stage 4 (Highlighted) -->
    <rect x="525" y="0" width="165" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect x="525" y="0" width="165" height="5" fill="#38bdf8" />
    <text x="540" y="30" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">MODULE 04 • 核心</text>
    <text x="540" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">4層金字塔+Warp</text>
    <text x="540" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      <tspan x="540" dy="0">• 256→128→64→32</tspan>
      <tspan x="540" dy="20">• 2^n 對齊 Warp32</tspan>
      <tspan x="540" dy="20">• BatchNorm 穩分佈</tspan>
      <tspan x="540" dy="20">• Dropout(0.2)防死記</tspan>
      <tspan x="540" dy="30" fill="#38bdf8">LIB-203 硬體對齊</tspan>
    </text>

    <!-- Arrow 4 to 5 -->
    <path d="M 695 115 L 708 115" stroke="#10b981" stroke-width="2" marker-end="url(#arrowCode)" />

    <!-- Stage 5 -->
    <rect x="715" y="0" width="135" height="230" rx="10" fill="url(#cardGradCode)" stroke="#334155" stroke-width="1.5" />
    <rect x="715" y="0" width="135" height="4" fill="url(#greenAccent)" />
    <text x="725" y="30" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">MODULE 05</text>
    <text x="725" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">監控與評估</text>
    <text x="725" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      <tspan x="725" dy="0">• Loss 雙軌曲線</tspan>
      <tspan x="725" dy="20">• Acc 泛化監測</tspan>
      <tspan x="725" dy="20">• 獨立抽樣測試</tspan>
      <tspan x="725" dy="20">• argmax 解析</tspan>
      <tspan x="725" dy="30" fill="#10b981">98.2% 泛化</tspan>
    </text>

    <!-- Arrow 5 to 6 -->
    <path d="M 855 115 L 868 115" stroke="#10b981" stroke-width="2" marker-end="url(#arrowCode)" />

    <!-- Stage 6 -->
    <rect x="875" y="0" width="125" height="230" rx="10" fill="url(#cardGradCode)" stroke="#334155" stroke-width="1.5" />
    <rect x="875" y="0" width="125" height="4" fill="url(#greenAccent)" />
    <text x="885" y="30" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">MODULE 06</text>
    <text x="885" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Gradio 部署</text>
    <text x="885" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      <tspan x="885" dy="0">• Web 畫板整合</tspan>
      <tspan x="885" dy="20">• 質心對齊演算法</tspan>
      <tspan x="885" dy="20">• 消除 1 猜 5</tspan>
      <tspan x="885" dy="20">• 消除 7 猜 8</tspan>
      <tspan x="885" dy="30" fill="#10b981">[RULE-901-03]</tspan>
    </text>
  </g>

  <!-- Bottom Hardware Invariant Spec Box -->
  <g transform="translate(50, 420)">
    <rect width="1000" height="170" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="25" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">⚙️ 底層硬體映射：為什麼 256→128→64→32 節點設計是神來之筆？</text>
    <text x="25" y="65" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">
      <tspan x="25" dy="0">1. GPU SIMT 執行緒對齊：NVIDIA CUDA 架構以 Warp (32 Threads) 為發射排程單元，節點數為 32 的整數倍時享有 100% Coalesced Access 快取命中率。</tspan>
      <tspan x="25" dy="24">2. 金字塔特徵提煉：底層 256 維捕捉豐富邊緣與局部紋理；往後層層收斂 (128→64→32)，強迫拋棄次要雜訊，只提煉最核心的拓樸幾何語意。</tspan>
      <tspan x="25" dy="24">3. 參數量最佳化：總參數量精準控制在 24.5 萬，比盲目堆疊 8 層網路 (88 萬參數) 降低 72% 算力開銷，並徹底終結過擬合與過度自信 (Overconfidence)！</tspan>
    </text>
  </g>
</svg>