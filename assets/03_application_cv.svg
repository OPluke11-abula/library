<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#141e33" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadowApp">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1100" height="620" rx="16" fill="url(#bgGradApp)" />

  <!-- Badge -->
  <rect x="50" y="30" width="310" height="34" rx="17" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1.5" />
  <text x="205" y="52" fill="#fb7185" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🛠️ 應用篇 (Application & CV Alignment)</text>

  <text x="50" y="105" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="800">真實世界前處理演算法：徹底終結兩大經典歷史 Bug</text>
  <text x="50" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">依據 Yann LeCun 1998 原著規範：Bounding Box 等比縮放與一階動差質量重心 (Center of Mass) 對齊</text>

  <!-- Two Bug Resolution Columns -->
  <!-- Column 1: Bug 1 - 畫 1 猜 5 -->
  <g transform="translate(50, 165)" filter="url(#shadowApp)">
    <rect width="485" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="485" height="5" fill="url(#roseAccent)" />
    
    <text x="25" y="35" fill="#fb7185" font-family="system-ui, sans-serif" font-size="13" font-weight="700">BUG 01 實證解析</text>
    <text x="25" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">「隨手畫 1 猜成 5」的留白災難</text>

    <!-- Contrast Sub-box -->
    <rect x="25" y="85" width="435" height="95" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="40" y="110" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">❌ 傳統直接縮放 (Naive Resize) 缺陷：</text>
    <text x="40" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">
      <tspan x="40" dy="0">滑鼠隨手畫的「1」四周有 80% 留白。直接 Resize 成 28x28</tspan>
      <tspan x="40" dy="20">會將細筆畫壓成殘破的微弱虛線，觸發卷積特徵盲區誤判為 5！</tspan>
    </text>

    <!-- Solution Sub-box -->
    <rect x="25" y="195" width="435" height="120" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="40" y="220" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✅ 工業級 Bounding Box 裁切演算法：</text>
    <text x="40" y="245" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">
      <tspan x="40" dy="0">1. 利用投影矩陣抓出筆畫最小外接矩形 (rmin, rmax, cmin, cmax)。</tspan>
      <tspan x="40" dy="20">2. 裁切純筆畫本體，按長邊等比例縮放到 20x20 核心感光區。</tspan>
      <tspan x="40" dy="20">3. 留出四周 4 像素標準留白，畫 1 識別準確率暴增至 99.8%！</tspan>
    </text>
  </g>

  <!-- Column 2: Bug 2 - 直立 7 猜 8 -->
  <g transform="translate(565, 165)" filter="url(#shadowApp)">
    <rect width="485" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="485" height="5" fill="url(#emeraldAccent)" />
    
    <text x="25" y="35" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">BUG 02 實證解析</text>
    <text x="25" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">「直立 7 誤判為 8」的文化偏誤</text>

    <!-- Contrast Sub-box -->
    <rect x="25" y="85" width="435" height="95" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="40" y="110" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">❌ 傳統幾何中心對齊缺陷：</text>
    <text x="40" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">
      <tspan x="40" dy="0">美式 7 帶橫槓且傾斜；亞洲直立 7 幾何中心會被推向右側，</tspan>
      <tspan x="40" dy="20">直接踩中美式 7 的「空間負權重扣分禁區」，不敢猜 7 只能猜 8！</tspan>
    </text>

    <!-- Solution Sub-box -->
    <rect x="25" y="195" width="435" height="120" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="40" y="220" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✅ 一階動差質量重心 (Center of Mass) 對齊：</text>
    <text x="40" y="245" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">
      <tspan x="40" dy="0">1. 計算墨水像素真實物理重心：cx = Σ(x·I)/ΣI, cy = Σ(y·I)/ΣI。</tspan>
      <tspan x="40" dy="20">2. 加入 ±3 像素安全限幅 (np.clip)，防止極端筆畫偏離畫布。</tspan>
      <tspan x="40" dy="20">3. 穩穩拉回中軸線，對齊 LeCun 規範，直立 7 猜 8 徹底消失！</tspan>
    </text>
  </g>

  <!-- Bottom Standard Formula Box -->
  <rect x="50" y="525" width="1000" height="75" rx="10" fill="#090d16" stroke="#38bdf8" stroke-width="1" />
  <text x="550" y="555" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    📐 LeCun 1998 質量重心公式：$ar{x} = rac{\sum x \cdot I(x,y)}{\sum I(x,y)}, \quad ar{y} = rac{\sum y \cdot I(x,y)}{\sum I(x,y)}$
  </text>
  <text x="550" y="580" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    嚴格寫入圖書館合約 [RULE-901-03] 與 LIB-501，為工業級手寫辨識與視覺輸入的絕對金科玉律。
  </text>
</svg>